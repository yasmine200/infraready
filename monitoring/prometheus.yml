global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/infraready.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: linux
    static_configs:
      - targets: ['192.168.50.20:9100']
        labels: {host: LINUX01}
      - targets: ['localhost:9100']
        labels: {host: OPS01}

  - job_name: windows
    static_configs:
      - targets: ['192.168.50.10:9182']
        labels: {host: WIN-DC01}
