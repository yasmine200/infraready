groups:
  - name: infraready
    rules:
      - alert: HoteInjoignable
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} ne repond plus"
      - alert: DisqueLinuxPresquePlein
        expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 < 20
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Espace disque faible sur {{ $labels.instance }} ({{ $labels.mountpoint }})"
